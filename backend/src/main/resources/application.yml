spring:
  application:
    name: trade-monitor-backend
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/trademonitor_db}
    username: ${DB_USERNAME:trademonitor}
    password: ${DB_PASSWORD:trademonitor123}
    pool:
      max-size: 20
      initial-size: 5
  webflux:
    multipart:
      max-in-memory-size: 20MB
  codec:
    max-in-memory-size: 20MB

server:
  port: 8080

trademonitor:
  # Script khởi tạo schema, chạy mỗi lần start (idempotent)
  schema-location: classpath:schema.sql
  # Các giá trị mặc định; có thể sửa trên màn Settings (lưu vào bảng app_settings)
  initial-balance: 10000
  alerts:
    max-drawdown-percent: 10
    large-loss-amount: 500
  telegram:
    bot-token: "${TELEGRAM_BOT_TOKEN:}"
    chat-id: "${TELEGRAM_CHAT_ID:}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
